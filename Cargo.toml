[package]
name = "charts-rs-web"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.8.9"
axum-client-ip = "1.3.1"
charts-rs = { version = "1.0.0", features = ["image-encoder"] }
chrono = "0.4.45"
config = { version = "0.15.25", features = ["yaml"] }
glob = "0.3.4"
hex = "0.4.3"
http-body-util = "0.1.4"
image = "0.25.10"
imagequant = { version = "4.4.1", default-features = false }
lodepng = "3.12.2"
mime = "0.3.17"
num_cpus = "1.17.0"
once_cell = "1.21.4"
rgb = "0.8.52"
rust-embed = { version = "8.12.0", features = ["mime-guess", "compression"] }
serde = "1.0.229"
serde_json = "1.0.151"
snafu = "0.9.2"
substring = "1.4.5"
time = "0.3.54"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "signal",
] }
tower = { version = "0.5.3", features = ["timeout"] }
tower-http = { version = "0.7.0", features = [
    "compression-gzip",
    "compression-br",
    "compression-zstd",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["local-time"] }
urlencoding = "2.1.3"
validator = { version = "0.21.0", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
