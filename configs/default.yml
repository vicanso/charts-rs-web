# 需要注意配置仅支持两层级形式
basic:
  listen: 0.0.0.0:5000
  requestLimit: 1000
mcp:
  # 允许访问/mcp的Host，多个以,分隔，为空表示不校验
  allowedHosts: ""
limits:
  maxJsonBytes: "1048576"
  maxCanvasSide: "8192"
  maxDataPoints: "100000"
  maxMermaidSource: "65536"
shortLink:
  store: ""
  defaultTtl: "86400"
  maxTtl: "604800"
  maxEntries: "10000"
  baseUrl: ""
redis:
  url: ""
  cluster: "false"
  keyPrefix: "charts:short_link:"
database:
  url: ""
  maxConnections: "10"
  minConnections: "0"
  acquireTimeout: "5"
  tableName: "chart_short_links"
  autoMigrate: "true"
